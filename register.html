<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOIS Member Registration | Indian Online Income Supporting System</title>
    <meta name="description" content="IOIS Platform - ₹10 से शुरुआत करें और डिजिटल रिसोर्सेज के साथ इनकम प्रोसेस शुरू करें।">
    <meta name="theme-color" content="#030712">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, rgba(245,158,11,.10), transparent 35%), #030712;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }
        .tiranga-text {
            background: linear-gradient(90deg, #f97316 0%, #ffffff 50%, #10b981 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass {
            background: rgba(15,23,42,.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(245,158,11,.25);
            box-shadow: 0 25px 70px rgba(0,0,0,.55), inset 0 0 40px rgba(15,23,42,.45);
        }
        .input-box {
            background: #080d1e;
            border: 1px solid rgba(100,116,139,.65);
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        .input-box:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 2px rgba(245,158,11,.25);
            outline: none;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="glass w-full max-w-lg p-6 md:p-8 rounded-2xl my-8">
        <div class="text-center mb-6">
            <a href="index.html" class="inline-block text-sm font-bold text-gray-400 hover:text-white mb-2"><i class="fa-solid fa-arrow-left"></i> Home पर वापस जाएं</a>
            <h1 class="text-2xl font-bold tiranga-text">IOIS Member Registration</h1>
            <p class="text-xs text-gray-400 mt-1">₹10 से ₹999 प्लान और डिजिटल आईडी कार्ड सेटअप</p>
        </div>
        
        <form id="registration-form" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-300 mb-1">पूरा नाम (Full Name) *</label>
                <input type="text" id="reg-name" required class="input-box w-full px-4 py-2 rounded-lg text-white text-sm" placeholder="अपना पूरा नाम दर्ज करें">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-300 mb-1">ईमेल आईडी (Email) *</label>
                    <input type="email" id="reg-email" required class="input-box w-full px-4 py-2 rounded-lg text-white text-sm" placeholder="name@example.com">
                </div>
                <div>
                    <label class="block text-xs text-gray-300 mb-1">व्हाट्सएप नंबर (10 डिजिट) *</label>
                    <input type="tel" id="reg-phone" inputmode="numeric" maxlength="10" required class="input-box w-full px-4 py-2 rounded-lg text-white text-sm" placeholder="9876543210">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-300 mb-1">पासवर्ड बनाएं (Password) *</label>
                    <input type="password" id="reg-password" required class="input-box w-full px-4 py-2 rounded-lg text-white text-sm" placeholder="••••••••">
                </div>
                <div>
                    <label class="block text-xs text-gray-300 mb-1">मेम्बरशिप प्लान चुनें *</label>
                    <select id="reg-plan" class="input-box w-full px-4 py-2 rounded-lg text-white text-sm">
                        <option value="10">₹10 - Standard Digital ID Plan</option>
                        <option value="49">₹49 - Silver Creator Plan</option>
                        <option value="99">₹99 - Gold Growth Plan</option>
                        <option value="199">₹199 - Platinum Pro Plan</option>
                        <option value="499">₹499 - Business Executive Plan</option>
                        <option value="999">₹999 - Master Elite Plan</option>
                    </select>
                </div>
            </div>

            <div class="border-t border-gray-800 pt-3">
                <label class="block text-xs font-bold text-amber-400 mb-2"><i class="fa-solid fa-wallet"></i> पेमेंट रिसीविंग विकल्प (खुद का या घर के किसी सदस्य का)</label>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">UPI ID (Google Pay / PhonePe / Paytm)</label>
                        <input type="text" id="reg-upi" class="input-box w-full px-4 py-2 rounded-lg text-white text-sm" placeholder="username@oksbi / 9876543210@paytm">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">बैंक खाता नंबर (Account No.)</label>
                            <input type="text" id="reg-acc" class="input-box w-full px-2 py-1.5 rounded-lg text-white text-xs" placeholder="Account Number">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">आईएफएससी कोड (IFSC Code)</label>
                            <input type="text" id="reg-ifsc" class="input-box w-full px-2 py-1.5 rounded-lg text-white text-xs" placeholder="SBIN000XXXX">
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-xs text-gray-300 mb-1">रेफरल कोड (यदि किसी ने जोड़ा हो)</label>
                <input type="text" id="reg-ref" class="input-box w-full px-4 py-2 rounded-lg text-white text-sm" placeholder="Referral Code">
            </div>

            <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold rounded-lg transition duration-200 text-sm shadow-lg">
                🚀 रजिस्टर करें और इनकम शुरू करें
            </button>
        </form>
        
        <p class="text-center text-xs text-gray-400 mt-4">
            क्या आपका अकाउंट पहले से है? <a href="login.html" class="text-amber-400 hover:underline font-bold">लॉगिन करें</a>
        </p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();

        document.getElementById('registration-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const plan = document.getElementById('reg-plan').value;
            const upi = document.getElementById('reg-upi').value;

            try {
                // Firebase यूजर क्रिएशन
                await auth.createUserWithEmailAndPassword(email, password);
                alert('🎉 रजिस्ट्रेशन सफल! IOIS Platform में आपका स्वागत है।');
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert('रजिस्ट्रेशन असफल: ' + error.message);
            }
        });
    </script>
</body>
</html>
