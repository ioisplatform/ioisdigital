<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>IOIS Login | Indian Online Income Supporting System</title>

    <meta name="description"
          content="IOIS Platform Member Login - Securely access your IOIS account and member dashboard.">

    <meta name="theme-color" content="#030712">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    >

    <!-- Firebase App (Core) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    rgba(245,158,11,.10),
                    transparent 35%
                ),
                #030712;
            color: white;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .tiranga-text {
            background:
                linear-gradient(
                    90deg,
                    #f97316 0%,
                    #ffffff 50%,
                    #10b981 100%
                );

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass {
            background: rgba(15,23,42,.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border:
                1px solid
                rgba(245,158,11,.25);

            box-shadow:
                0 25px 70px rgba(0,0,0,.55),
                inset 0 0 40px rgba(15,23,42,.45);
        }

        .input-box {
            background: #080d1e;
            border:
                1px solid
                rgba(100,116,139,.65);

            transition:
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .input-box:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 2px rgba(245,158,11,.25);
            outline: none;
        }

    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="glass w-full max-w-md p-8 rounded-2xl">
        <h1 class="text-2xl font-bold text-center mb-6 tiranga-text">IOIS Login</h1>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Email</label>
                <input type="email" id="email" required class="input-box w-full px-4 py-2 rounded-lg text-white" placeholder="name@example.com">
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-1">Password</label>
                <input type="password" id="password" required class="input-box w-full px-4 py-2 rounded-lg text-white" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold rounded-lg transition duration-200">
                Login
            </button>
        </form>
    </div>

    <script>
        // Firebase Configuration (अपने प्रोजेक्ट के हिसाब से यहाँ डिटेल्स डालें)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();

        // Login Handler
        const loginForm = document.getElementById('login-form');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await auth.signInWithEmailAndPassword(email, password);
                alert('Login Successful!');
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
