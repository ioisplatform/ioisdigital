<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOIS Login | Indian Online Income Supporting System</title>
    <meta name="description" content="IOIS Platform Member Login - सुरक्षित रूप से अपने डैशबोर्ड में प्रवेश करें।">
    <meta name="theme-color" content="#030712">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, rgba(245,158,11,.10), transparent 35%), #030712;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }
        .tiranga-text {
            background: linear-gradient(90deg, #f97316 0%, #ffffff 50%, #10b981 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass {
            background: rgba(15,23,42,.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(245,158,11,.25);
            box-shadow: 0 25px 70px rgba(0,0,0,.55), inset 0 0 40px rgba(15,23,42,.45);
        }
        .input-box {
            background: #080d1e;
            border: 1px solid rgba(100,116,139,.65);
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        .input-box:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 2px rgba(245,158,11,.25);
            outline: none;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="glass w-full max-w-md p-8 rounded-2xl">
        <div class="text-center mb-6">
            <a href="index.html" class="inline-block text-sm font-bold text-gray-400 hover:text-white mb-2"><i class="fa-solid fa-arrow-left"></i> Home पर वापस जाएं</a>
            <h1 class="text-2xl font-bold tiranga-text">IOIS Member Login</h1>
            <p class="text-xs text-gray-400 mt-1">अपने सुरक्षित डैशबोर्ड में प्रवेश करें</p>
        </div>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-300 mb-1">ईमेल आईडी (Email) *</label>
                <input type="email" id="login-email" required class="input-box w-full px-4 py-2.5 rounded-lg text-white text-sm" placeholder="name@example.com">
            </div>

            <div>
                <label class="block text-xs text-gray-300 mb-1">पासवर्ड या पिन (Password) *</label>
                <input type="password" id="login-password" required class="input-box w-full px-4 py-2.5 rounded-lg text-white text-sm" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-gray-950 font-bold rounded-lg transition duration-200 text-sm shadow-lg">
                🔐 सुरक्षित लॉगिन (Secure Login)
            </button>
        </form>

        <p class="text-center text-xs text-gray-400 mt-4">
            नया खाता बनाना चाहते हैं? <a href="register.html" class="text-amber-400 hover:underline font-bold">रजिस्टर करें</a>
        </p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                await auth.signInWithEmailAndPassword(email, password);
                alert('✅ लॉगिन सफल! डैशबोर्ड पर रीडायरेक्ट किया जा रहा है।');
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert('❌ लॉगिन असफल: ' + error.message);
            }
        });
    </script>
</body>
</html>
